# site properties and page defaults
title: 中国石油大学（北京）SPR 战队
subtitle: RoboMaster 机器人战队
description: SPR 战队隶属于中国石油大学（北京），是学校面向 RoboMaster 机甲大师赛组建的学生科技创新团队，成立于 2004 年。
lang: zh-CN
header: images/spr_background.jpg
# 首页封面轮播图：按顺序循环淡入淡出，建议 3–5 张、统一横向构图（16:9 或 3:2）
header-slides:
  - images/spr_background.jpg
  - images/hero/hero-field.jpg
  - images/hero/hero-stand.jpg
footer:  images/spr_footer.jpg
proofer: false
slogan: 京中铁狮，所向披靡
# 导航栏右侧的站外链接（按顺序追加在内置页面之后）
nav_external:
  - text: 战队空间
    url: https://bbs.robomaster.com/reg/team-space?teamId=92
    tooltip: RoboMaster 官方战队空间

# 每年换届只需要改这里：
#   current     成员页展示的赛季号，对应 _members 里的 seasons / echelon
#   events_year 首页「近期赛程」筛选的年份，对应 _events 里的 date
season:
  current: "27"
  events_year: 2026

# site social media and other links
# 新增联系方式时注意：github 需要完整 URL，微信/邮箱不是链接的不要放这里
links:
  # email: your-address@example.com
  github: https://github.com/darkcome6/SPR_WEBSITE
  bilibili: "1489728412"
## jekyll settings

# front matter defaults
defaults:
  # all markdown files
  - scope:
      path: ""
    values:
      layout: default
  # markdown files in /_members
  - scope:
      type: "members"
    values:
      layout: member
  - scope:
      type: "awards"
    values:
      layout: award
  - scope:
      type: "events"
    values:  
      layout: event
  # markdown files in /_posts
  - scope:
      type: "posts"
    values:
      layout: post
  - scope:
      type: "news"
    values:
      layout: post



collections:
  # generate page for each member
  members:
    output: true
  # generate page for each post
  posts:
    output: true
  awards:
    output: true
  news:
    output: true
  # 大创项目与专利不对外展示，数据保留在 _projects / _patents 中备用
  projects:
    output: false
  patents:
    output: false
  events:
    output: true

# jekyll plugins
plugins:
  - jekyll-spaceship
  - jekyll-sitemap
  - jekyll-redirect-from
  - jekyll-feed
  - jekyll-last-modified-at

# code block syntax highlighting
highlighter: rouge

# jekyll theme
theme: null

# sass settings
sass:
  sass_dir: _styles

# force jekyll to include certain files/folders
include:
  - _styles
  - _scripts
  - _vendor

# force jekyll to exclude certain files/folders
exclude:
  - README.md
  - LICENSE.md
  - CITATION.cff
  - Gemfile
  - Gemfile.lock
  - generate_member.py
  - tools
  - data-inbox
  - .github
  - .docker
  - .vscode
