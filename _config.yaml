# site properties and page defaults
title: 中国石油大学 SPR 战队
subtitle: RoboMaster 机器人战队
description: 中国石油大学（北京）SPR 战队，以参加 RoboMaster 机器人比赛为主、以培养队员全面综合能力为目标的机器人团队。
lang: zh-CN
header: images/spr_background.jpg
header-video: images/bgvideo.mp4
footer:  images/spr_footer.jpg
proofer: false
slogan: 九楼灯火长明,赛场我们必赢

# 每年换届只需要改这里：
#   current     成员页展示的赛季号，对应 _members 里的 seasons / echelon
#   events_year 首页「近期赛程」筛选的年份，对应 _events 里的 date
season:
  current: "24"
  events_year: 2025

# site social media and other links
# 新增联系方式时注意：github 需要完整 URL，微信/邮箱不是链接的不要放这里
links:
  # email: your-address@example.com
  github: https://github.com/darkcome6/SPR_WEBSITE
  bilibili: "475402455"
## jekyll settings

# front matter defaults
defaults:
  # all markdown files
  - scope:
      path: ""
    values:
      layout: default
  # markdown files in /_members
  - scope:
      type: "members"
    values:
      layout: member
  - scope:
      type: "awards"
    values:
      layout: award
  - scope:
      type: "events"
    values:  
      layout: event
  # markdown files in /_posts
  - scope:
      type: "posts"
    values:
      layout: post
  - scope:
      type: "news"
    values:
      layout: post



collections:
  # generate page for each member
  members:
    output: true
  # generate page for each post
  posts:
    output: true
  awards:
    output: true
  news:
    output: true
  projects:
    output: true
  patents:
    output: true
  events:
    output: true

# jekyll plugins
plugins:
  - jekyll-spaceship
  - jekyll-sitemap
  - jekyll-redirect-from
  - jekyll-feed
  - jekyll-last-modified-at

# code block syntax highlighting
highlighter: rouge

# jekyll theme
theme: null

# sass settings
sass:
  sass_dir: _styles

# force jekyll to include certain files/folders
include:
  - _styles
  - _scripts

# force jekyll to exclude certain files/folders
exclude:
  - README.md
  - LICENSE.md
  - CITATION.cff
