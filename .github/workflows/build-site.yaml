name: build-site
run-name: build live site

on:
  # run when called from another workflow
  workflow_call:

  # run if user manually requests it
  workflow_dispatch:

# variables
env:
  PREVIEWS_FOLDER: preview

permissions:
  contents: write

jobs:
  build-site:
    # 固定 runner 版本：ubuntu-latest 已指向 26.04，ruby/setup-ruby 尚不支持
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout branch contents
        uses: actions/checkout@v4

      - name: Install Ruby packages
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.1"
          bundler-cache: true

      - name: Get Pages url
        id: pages
        uses: actions/configure-pages@v4
      - if: runner.debug == '1'
        uses: mxschmitt/action-tmate@v3

      - name: Set root url
        run: |
          printf "\n\nurl: ${{ steps.pages.outputs.origin }}" >> _config.yaml

      - name: Build live version of site
        run: |
          JEKYLL_ENV=production bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path || '' }}"

      # 自定义域名：在仓库 Settings → Secrets and variables → Actions → Variables
      # 添加 CUSTOM_DOMAIN（如 www.spr-xxx.com）即可。
      # 本站按「构建后 push gh-pages」方式发布，CNAME 必须落在产物里，
      # 否则每次部署都会被覆盖掉，域名会静默失效。
      - name: Write CNAME for custom domain
        if: vars.CUSTOM_DOMAIN != ''
        run: printf '%s\n' "${{ vars.CUSTOM_DOMAIN }}" > _site/CNAME

      - name: Commit live site to Pages branch
        uses: JamesIves/github-pages-deploy-action@v4.5.0
        with:
          folder: _site
          clean-exclude: ${{ env.PREVIEWS_FOLDER }}
          force: false
