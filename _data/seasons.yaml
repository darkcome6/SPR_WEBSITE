# 赛季数据：首页时间轴、成果页「历史成绩」、成员页共用这一份。
# 从新到旧排列，每年新增赛季时在最前面加一条。
#   season          赛季号（与 _members 的 seasons 对应）
#   year            年份
#   title           赛季标题
#   rank            区域赛成绩，显示在徽章与历史成绩里；留空则不显示
#   award           全国赛成绩；留空则不显示
#   rank_value      全国赛名次数字（越小越好），填了才出现在积分榜趋势图
#   cover           封面图；留空则不显示
#   summary         一句话赛季记忆
#   url             点击跳转的页面，留空则卡片不可点击
#   timeline        false 表示只进历史成绩、不进首页时间轴（用于较早赛季）

